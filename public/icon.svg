<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8" />

  <!-- Sparkling Star / ✦ Icon -->
  <path d="M256 90 Q256 220 386 256 Q256 292 256 422 Q256 292 126 256 Q256 220 256 90 Z" fill="#ffffff" filter="url(#glow)" />

  <!-- Subtitle Bar Decorative Elements -->
  <rect x="156" y="380" width="200" height="24" rx="12" fill="#ffffff" opacity="0.95" />
  <rect x="186" y="420" width="140" height="18" rx="9" fill="#ffd1f3" opacity="0.9" />
</svg>
